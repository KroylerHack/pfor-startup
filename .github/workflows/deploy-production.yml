name: PFOR Production Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run project checks
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_business_requirements.py -q
          pytest tests/test_smoke.py -q

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .env from GitHub Secrets
        shell: bash
        env:
          POSTGRES_SERVER: ${{ secrets.POSTGRES_SERVER }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          cat > .env <<EOF
          POSTGRES_SERVER=${POSTGRES_SERVER}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
          OLLAMA_MODEL=${OLLAMA_MODEL}
          SECRET_KEY=${SECRET_KEY}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          EOF

      - name: Sync application files
        run: |
          rsync -av --delete --exclude='.git' --exclude='.venv' --exclude='venv' --exclude='.env' --exclude='__pycache__' ./ /pfor/

      - name: Create venv and install dependencies
        working-directory: /pfor
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Apply environment for runtime
        working-directory: /pfor
        run: |
          cp .env /pfor/.env

      - name: Start or restart service
        run: |
          sudo cp /pfor/deploy/pfor.service /etc/systemd/system/pfor.service
          sudo systemctl daemon-reload
          sudo systemctl enable pfor
          sudo systemctl restart pfor

      - name: Health check
        run: |
          curl -fsS http://127.0.0.1:8000/health
