name: PFOR Safe Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit checks
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_business_requirements.py -q

      - name: Run smoke checks
        env:
          PYTHONPATH: src
          ENABLE_LIVE_INFRA: 'false'
        run: |
          pytest tests/test_smoke.py -q

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployment env file
        env:
          POSTGRES_SERVER: ${{ secrets.POSTGRES_SERVER }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          cat > .env <<EOF
          POSTGRES_SERVER=${POSTGRES_SERVER}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
          OLLAMA_MODEL=${OLLAMA_MODEL}
          SECRET_KEY=${SECRET_KEY}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          EOF

      - name: Sync code to app dir
        run: |
          rsync -av --exclude='.git' --exclude='.venv' --exclude='venv' --exclude='.env' --exclude='__pycache__' ./ /pfor/

      - name: Install Python dependencies
        working-directory: /pfor
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

      - name: Run app health check
        working-directory: /pfor
        env:
          PYTHONPATH: src
        run: |
          ./venv/bin/python - <<'PY'
          import os
          os.environ.setdefault('PYTHONPATH', 'src')
          from pfor.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          r = client.get('/health')
          print(r.status_code, r.json())
          assert r.status_code == 200
          PY

      - name: Restart service
        run: |
          sudo systemctl restart pfor || true

      - name: Final health check
        run: |
          curl -fsS http://127.0.0.1:8000/health || exit 1
