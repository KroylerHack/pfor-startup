name: PFOR Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Зеркальная синхронизация кода в реальную папку /home/pfor/pfor/
      - name: Sync latest code
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='.env' \
            --exclude='__pycache__' \
            ./ /home/pfor/pfor/

      # 2. Очистка кэша и обновление зависимостей Python
      - name: Install dependencies & Cleanup Cache
        run: |
          find /home/pfor/pfor -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null || true
          find /home/pfor/pfor -type f -name "*.pyc" -delete 2>/dev/null || true
          /home/pfor/pfor/venv/bin/pip install --upgrade pip
          /home/pfor/pfor/venv/bin/pip install -r /home/pfor/pfor/requirements.txt

      # 3. Обновление systemd службы
      - name: Update systemd service config
        run: |
          if [ -f /home/pfor/pfor/deploy/pfor.service ]; then
            sudo cp /home/pfor/pfor/deploy/pfor.service /etc/systemd/system/pfor.service
            sudo systemctl daemon-reload
          fi

      # 4. Перезапуск FastAPI службы
      - name: Restart FastAPI service
        run: |
          sudo systemctl restart pfor
          sleep 6

      # 5. Проверка доступности API (Healthcheck)
      - name: Check Health
        run: |
          curl -fsS http://127.0.0.1:8000/health || curl -fsS http://127.0.0.1:8000/docs