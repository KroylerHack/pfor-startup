name: PFOR Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write env file from GitHub Secrets
        shell: bash
        env:
          POSTGRES_SERVER: ${{ secrets.POSTGRES_SERVER }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          cat > .env <<'EOF'
          POSTGRES_SERVER=${POSTGRES_SERVER}
          POSTGRES_PORT=${POSTGRES_PORT}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
          OLLAMA_MODEL=${OLLAMA_MODEL}
          SECRET_KEY=${SECRET_KEY}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          EOF

      - name: Sync files to app directory
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='venv' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            ./ /pfor/

      - name: Install Python dependencies
        run: |
          if [ ! -d /pfor/venv ]; then
            python3 -m venv /pfor/venv
          fi
          /pfor/venv/bin/pip install --upgrade pip
          /pfor/venv/bin/pip install -r /pfor/requirements.txt

      - name: Restart FastAPI service
        run: |
          sudo cp /pfor/deploy/pfor.service /etc/systemd/system/pfor.service
          sudo systemctl daemon-reload
          sudo systemctl restart pfor

      - name: Health check
        run: |
          curl -fsS http://127.0.0.1:8000/health
